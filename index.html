<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>FinnVerse — Protótipo MVP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0d0b18; --bg2:#151226; --card:#1b1730; --card2:#221d3b; --line:#2e2850; --text:#f2eefc; --muted:#a69fc4;
  --violet:#8b5cf6; --turq:#2dd4bf; --pink:#ff8fb1; --amber:#fbbf24;
  --ok:#34d399; --warn:#fbbf24; --bad:#f43f5e; --build:#a78bfa;
  --r:16px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif;font-size:14px;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
h2,h3,.score b,.brand b{font-family:Sora,Inter,sans-serif}
#app{display:grid;grid-template-columns:1fr 400px;gap:14px;height:100%;padding:14px}
#stage{position:relative;border-radius:22px;overflow:hidden;background:radial-gradient(120% 90% at 50% 0%,#2a2250,#0f0c1d);border:1px solid var(--line);min-height:0}
#canvas-wrap,#canvas-wrap canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
.glass{background:rgba(18,14,34,.62);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.08)}
.topbar{position:absolute;top:14px;left:14px;right:14px;display:flex;align-items:center;gap:10px;pointer-events:none}
.topbar>*{pointer-events:auto}
.brand{display:flex;align-items:center;gap:8px;padding:6px 12px 6px 6px;border-radius:14px}
.brand b{font-size:16px;letter-spacing:.2px}.brand b span{color:var(--turq)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:999px;font-size:12px;font-weight:600;background:rgba(139,92,246,.18);color:#d9ccff;border:1px solid rgba(139,92,246,.35)}
.chip-sim{background:rgba(251,191,36,.18);color:#ffe3a1;border-color:rgba(251,191,36,.45)}
#weather{margin-left:auto;display:flex;align-items:center;gap:8px;padding:6px 12px;border-radius:14px}
#weather .wi{font-size:22px}#weather b{display:block;font-size:13px}#weather small{color:var(--muted);font-size:11px}
.hint{position:absolute;top:66px;left:14px;font-family:'JetBrains Mono',monospace;font-size:11px;color:#d8d2ee;padding:5px 9px;border-radius:8px;pointer-events:none}
#sim-banner{position:absolute;top:66px;left:50%;transform:translateX(-50%);padding:7px 14px;border-radius:999px;background:rgba(251,191,36,.92);color:#2a1d00;font-weight:600;font-size:12px;box-shadow:0 6px 20px rgba(0,0,0,.3)}
.tools{position:absolute;right:14px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:6px;padding:6px;border-radius:14px}
.tools button{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;font-size:17px;transition:.2s}
.tools button:hover{background:rgba(255,255,255,.08)}
.tools button.on{background:rgba(139,92,246,.35);box-shadow:inset 0 0 0 1px rgba(167,139,250,.6)}
.tools button#btn-qual{position:relative}
.tools button#btn-qual::after{content:'';position:absolute;right:5px;bottom:5px;width:7px;height:7px;border-radius:50%;background:var(--ok)}
.tools button#btn-qual[data-q=media]::after{background:var(--warn)}
.tools button#btn-qual[data-q=baixa]::after{background:#8a83a8}
.sticky{position:sticky;top:-14px;z-index:2;margin:-14px -14px 0;padding:14px 14px 10px;background:linear-gradient(var(--bg2) 82%,transparent)}
.tools hr{border:0;border-top:1px solid rgba(255,255,255,.1);margin:2px 4px}
.legend{position:absolute;left:14px;bottom:14px;display:flex;gap:14px;padding:8px 12px;border-radius:12px;font-size:12px;color:#ddd6f5}
.legend span::before{content:'';display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;background:var(--c)}
#tooltip{position:absolute;left:0;top:0;pointer-events:none;padding:7px 11px;border-radius:10px;background:rgba(15,12,29,.88);border:1px solid rgba(255,255,255,.12);white-space:nowrap;z-index:5}
#tooltip b{display:block;font-size:13px}#tooltip span{font-size:11px;color:var(--muted)}
#webgl-error{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:30px;color:var(--muted)}
#webgl-error[hidden],#sim-banner[hidden],#tooltip[hidden]{display:none}
#loading{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);font-size:13px}

/* painel */
#panel{display:flex;flex-direction:column;min-height:0;background:var(--bg2);border:1px solid var(--line);border-radius:22px;overflow:hidden}
#panel-handle{display:none}
.tabs{display:flex;gap:4px;padding:10px;border-bottom:1px solid var(--line)}
.tabs button{flex:1;padding:9px 4px;border-radius:10px;font-size:12.5px;font-weight:600;color:var(--muted);transition:.15s}
.tabs button.on{background:var(--card2);color:var(--text);box-shadow:inset 0 0 0 1px var(--line)}
#panel-body{flex:1;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:12px;scrollbar-width:thin;scrollbar-color:var(--line) transparent}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.row{display:flex;align-items:center}.between{justify-content:space-between}.gap{gap:8px}.gap>*{flex:1}.mt{margin-top:10px}
.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.muted{color:var(--muted);font-size:12px;line-height:1.5}
h3{font-size:16px}.section-h small{color:var(--muted);font-size:11px}
p{line-height:1.55;font-size:13.5px}
.tag{font-size:10px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:3px 7px;border-radius:6px}
.t-cad{background:rgba(45,212,191,.15);color:#7ff0dd}.t-sim{background:rgba(251,191,36,.16);color:#ffd77a}
.t-calc{background:rgba(139,92,246,.18);color:#cbb7ff}.t-proj{background:rgba(255,143,177,.16);color:#ffb6cc}
.health .score{display:flex;align-items:baseline;gap:4px;margin:8px 0 10px}
.score b{font-size:44px;line-height:1}.score span{color:var(--muted)}.score em{margin-left:auto;font-style:normal;font-weight:600;font-size:13px}
.bar{height:8px;border-radius:99px;background:#2c2648;overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--pink),var(--amber),var(--turq));transition:width .5s}
.bar.sm{height:5px;margin-top:8px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.stats small{display:block;color:var(--muted);font-size:11px;margin-bottom:3px}.stats b{font-family:'JetBrains Mono',monospace;font-size:13px}
.pos{color:var(--ok)}.neg{color:var(--bad)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tile{--c:var(--ok);text-align:left;padding:11px;border-radius:14px;background:linear-gradient(160deg,color-mix(in srgb,var(--c) 14%,var(--card)),var(--card));border:1px solid color-mix(in srgb,var(--c) 45%,transparent);display:flex;flex-direction:column;gap:2px;transition:transform .15s}
.tile:hover{transform:translateY(-2px)}
.tile b{font-size:13px}.tile small{font-size:11px;color:var(--muted)}
.tile-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.ico{font-size:18px}.ico.big{font-size:30px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--c);box-shadow:0 0 10px var(--c)}
.tile-val{font-family:'JetBrains Mono',monospace;font-size:13px;margin-top:6px;color:var(--c)}
.tile:last-child:nth-child(odd){grid-column:span 2}
.st-bom{--c:var(--ok)}.st-atencao{--c:var(--warn)}.st-critico{--c:var(--bad)}.st-build{--c:var(--build)}
.finn{display:flex;gap:12px;align-items:flex-start;background:linear-gradient(140deg,rgba(45,212,191,.1),rgba(139,92,246,.12));border-color:rgba(45,212,191,.25)}
.finn svg{flex:none}.finn b{font-family:Sora;font-size:13px;color:#7ff0dd}.finn p{font-size:13px;margin-top:2px}.finn a{color:#7ff0dd;font-weight:600}
.proj{margin:8px 0 6px}
.back{color:var(--muted);font-size:13px;text-align:left;padding:2px 0}.back:hover{color:var(--text)}
.det-h{display:flex;gap:12px;align-items:center}.det-h h2{font-size:22px}.det-h small{color:var(--muted)}
.det-val{display:flex;flex-direction:column;gap:2px;border-color:color-mix(in srgb,var(--c) 50%,transparent);background:linear-gradient(160deg,color-mix(in srgb,var(--c) 16%,var(--card)),var(--card))}
.det-val b{font-family:'JetBrains Mono',monospace;font-size:30px;color:var(--c)}.det-val small{color:var(--muted)}.det-val .tag{align-self:flex-start;margin-top:8px}
.badge{align-self:flex-start;font-size:11px;font-weight:700;padding:3px 9px;border-radius:99px;background:var(--c);color:#14101f;margin-bottom:6px}
.mono{font-family:'JetBrains Mono',monospace;font-size:12.5px;margin:6px 0;color:#e2dcf7}
.btn{padding:11px 14px;border-radius:12px;background:var(--card2);border:1px solid var(--line);font-weight:600;font-size:13px;transition:.15s}
.btn:hover{border-color:#4a3f80}.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.primary{background:linear-gradient(135deg,var(--violet),#6d3fe0);border-color:transparent;box-shadow:0 6px 18px rgba(139,92,246,.35)}
.btn.wide{width:100%}
.field{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.field span{font-weight:600;font-size:13px}.field small{display:block;font-weight:400;color:var(--muted);font-size:11.5px}
.money{display:flex;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:0 12px}
.money:focus-within{border-color:var(--violet)}
.money i{font-style:normal;color:var(--muted);font-size:13px}
.money input{flex:1;background:none;border:0;color:var(--text);font:500 15px 'JetBrains Mono',monospace;padding:11px 8px;outline:none;width:100%}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip-btn{padding:7px 11px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-size:12px;font-weight:500}
.chip-btn:hover{border-color:var(--amber);color:#ffe3a1}
.compare{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;text-align:center}
.compare small{color:var(--muted);font-size:11px;display:block}.compare b{font-family:Sora;font-size:30px;display:block}.compare em{font-style:normal;font-size:12px}
.arrow{font-family:'JetBrains Mono',monospace;font-weight:700;padding:6px 10px;border-radius:10px;background:var(--card2)}
.slider{display:block;padding:10px 12px;border-radius:12px;border:1px solid transparent}
.slider.changed{border-color:rgba(251,191,36,.35);background:rgba(251,191,36,.05)}
.slider span{display:flex;justify-content:space-between;font-size:13px;font-weight:600}
.slider span b{font-family:'JetBrains Mono',monospace;font-weight:500}
.slider small{color:var(--muted);font-size:11px}
input[type=range]{width:100%;margin:8px 0 4px;accent-color:var(--amber)}
.mission{display:flex;gap:12px;align-items:flex-start;padding:12px;border-radius:14px;background:var(--card);border:1px solid var(--line)}
.mission>div{flex:1}.mission b{font-size:13.5px}.mission small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.check{flex:none;width:24px;height:24px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:13px;font-weight:700}
.mission.done{border-color:rgba(52,211,153,.4)}.mission.done .check{background:var(--ok);border-color:var(--ok);color:#0d0b18}
.mprog{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--muted)}
#toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,30px);opacity:0;padding:11px 16px;border-radius:14px;background:#2a2346;border:1px solid #4a3f80;font-weight:600;font-size:13px;transition:.3s;pointer-events:none;z-index:20;box-shadow:0 10px 30px rgba(0,0,0,.4)}
#toast.show{opacity:1;transform:translate(-50%,0)}

/* mobile: painel vira gaveta inferior */
@media (max-width: 860px){
  #app{display:block;padding:0}
  #stage{position:fixed;inset:0;border-radius:0;border:0}
  .hint{display:none}
  .legend{display:none}
  .brand b{font-size:14px}
  .topbar{top:10px;left:10px;right:10px}
  #sim-banner{top:62px}
  .tools{top:62px;transform:none;right:10px;padding:4px;gap:3px}
  .tools button{width:34px;height:34px;font-size:15px}
  #panel{position:fixed;left:0;right:0;bottom:0;height:44vh;border-radius:22px 22px 0 0;border-bottom:0;transition:transform .35s cubic-bezier(.2,.8,.2,1);z-index:10;box-shadow:0 -10px 40px rgba(0,0,0,.45)}
  #panel.closed{transform:translateY(calc(44vh - 104px))}
  #panel-handle{display:flex;justify-content:center;padding:8px 0 0}
  #panel-handle i{width:42px;height:5px;border-radius:9px;background:#4a4370}
  .tabs{padding:8px 10px}
  #toast{bottom:auto;top:70px}
}
@media (max-width: 400px){.brand b{display:none}.chip{font-size:11px;padding:4px 8px}}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="app">
  <main id="stage">
    <div id="canvas-wrap"></div>
    <div id="loading">Construindo sua casa…</div>
    <div class="topbar">
      <div class="brand glass"><span id="brand-finn"></span><b>Finn<span>Verse</span></b></div>
      <span id="mode-chip" class="chip">Casa de exemplo</span>
      <div id="weather" class="glass"></div>
    </div>
    <div class="hint glass">Arraste para girar · role para aproximar · clique numa parte da casa</div>
    <div id="sim-banner" hidden>Modo simulação · nada foi salvo</div>
    <div class="tools glass" role="toolbar" aria-label="Controles da cena">
      <button id="btn-giro" title="Giro automático" aria-label="Giro automático">🔄</button>
      <button id="btn-home" title="Recentralizar câmera" aria-label="Recentralizar câmera">🎯</button>
      <button id="btn-qual" title="Qualidade visual (alta, média, econômica)" aria-label="Qualidade visual">✨</button>
      <hr>
      <button data-tempo="dia" title="Dia" aria-label="Dia">☀️</button>
      <button data-tempo="entardecer" title="Entardecer" aria-label="Entardecer">🌇</button>
      <button data-tempo="noite" title="Noite" aria-label="Noite">🌙</button>
    </div>
    <div class="legend glass"><span style="--c:var(--ok)">Saudável</span><span style="--c:var(--warn)">Atenção</span><span style="--c:var(--bad)">Crítico</span></div>
    <div id="tooltip" hidden></div>
    <div id="webgl-error" hidden><div><b>Não foi possível iniciar o 3D neste navegador.</b><br>Os indicadores continuam funcionando no painel.</div></div>
  </main>
  <aside id="panel">
    <button id="panel-handle" aria-label="Abrir ou fechar painel"><i></i></button>
    <nav class="tabs">
      <button data-aba="visao">Casa</button>
      <button data-aba="dados">Meus dados</button>
      <button data-aba="simular">Simular</button>
      <button data-aba="missoes">Missões</button>
    </nav>
    <div id="panel-body"></div>
  </aside>
</div>
<div id="toast" role="status" aria-live="polite"></div>
<script>/* FinnVerse — motor de cálculo financeiro (puro, sem dependências).
 * Regras: entradas são valores mensais (fluxos) ou saldos (estoques).
 * Fluxos e estoques nunca são somados entre si, evitando dupla contagem. */
(function (root) {
  'use strict';

  const FIELDS = [
    { key: 'rendaAtiva', label: 'Renda do trabalho', hint: 'Salário, pró-labore, freelas (por mês)', tipo: 'fluxo' },
    { key: 'rendaPassiva', label: 'Renda passiva', hint: 'Aluguéis, dividendos, juros (por mês)', tipo: 'fluxo' },
    { key: 'despesasFixas', label: 'Despesas fixas', hint: 'Moradia, contas, escola, planos (por mês)', tipo: 'fluxo' },
    { key: 'despesasVariaveis', label: 'Despesas variáveis', hint: 'Mercado, lazer, compras, delivery (por mês)', tipo: 'fluxo' },
    { key: 'parcelasDividas', label: 'Parcelas de dívidas', hint: 'Financiamentos, empréstimos, cartão parcelado (por mês)', tipo: 'fluxo' },
    { key: 'saldoDividas', label: 'Saldo devedor total', hint: 'Quanto falta pagar de todas as dívidas', tipo: 'estoque' },
    { key: 'reserva', label: 'Reserva de emergência', hint: 'Dinheiro guardado só para imprevistos', tipo: 'estoque' },
    { key: 'saldoDisponivel', label: 'Dinheiro disponível', hint: 'Conta corrente e saldo de uso imediato', tipo: 'estoque' },
  ];

  const EXEMPLO = {
    rendaAtiva: 6500, rendaPassiva: 250, despesasFixas: 3200, despesasVariaveis: 1600,
    parcelasDividas: 900, saldoDividas: 14000, reserva: 7000, saldoDisponivel: 2200,
  };

  const SCORE = { bom: 1, atencao: 0.5, critico: 0 };

  function sanitize(d) {
    const out = {};
    for (const f of FIELDS) {
      const v = Number(d && d[f.key]);
      out[f.key] = Number.isFinite(v) && v > 0 ? Math.round(v * 100) / 100 : 0;
    }
    return out;
  }

  // Faixa "quanto maior, melhor"
  function faixaAlta(v, bom, atencao) {
    if (v >= bom) return 'bom';
    if (v >= atencao) return 'atencao';
    return 'critico';
  }
  // Faixa "quanto menor, melhor"
  function faixaBaixa(v, bom, atencao) {
    if (v <= bom) return 'bom';
    if (v <= atencao) return 'atencao';
    return 'critico';
  }
  const clamp = (v, a, b) => Math.min(b, Math.max(a, v));

  function compute(raw) {
    const d = sanitize(raw);
    const rendaTotal = d.rendaAtiva + d.rendaPassiva;
    const custoMensal = d.despesasFixas + d.despesasVariaveis + d.parcelasDividas;
    const saldoMensal = rendaTotal - custoMensal;

    // meses cobertos por um estoque; sem custo → cobertura ilimitada se houver saldo
    const meses = (estoque) => (custoMensal > 0 ? estoque / custoMensal : (estoque > 0 ? Infinity : 0));
    // fração da renda; sem renda → 0 se não há gasto, senão "infinito" (crítico)
    const fracRenda = (v) => (rendaTotal > 0 ? v / rendaTotal : (v > 0 ? Infinity : 0));

    const mesesReserva = meses(d.reserva);
    const mesesLiquidez = meses(d.saldoDisponivel);
    const pctFixas = fracRenda(d.despesasFixas);
    const pctVariaveis = fracRenda(d.despesasVariaveis);
    const pctParcelas = fracRenda(d.parcelasDividas);
    const coberturaPassiva = custoMensal > 0 ? d.rendaPassiva / custoMensal : (d.rendaPassiva > 0 ? 1 : 0);
    const taxaPoupanca = rendaTotal > 0 ? saldoMensal / rendaTotal : (saldoMensal < 0 ? -Infinity : 0);

    let estadoDividas;
    if (d.parcelasDividas === 0 && d.saldoDividas === 0) estadoDividas = 'bom';
    else if (d.parcelasDividas === 0 && d.saldoDividas > 0) estadoDividas = 'atencao'; // dívida sem plano de pagamento
    else estadoDividas = faixaBaixa(pctParcelas, 0.15, 0.30);

    const elementos = {
      fundacao: { estado: faixaAlta(mesesReserva, 6, 3), valor: mesesReserva, nivel: clamp(mesesReserva / 6, 0, 1), peso: 1.2 },
      caixa: { estado: faixaAlta(mesesLiquidez, 1, 0.5), valor: mesesLiquidez, nivel: clamp(mesesLiquidez, 0, 1), peso: 1 },
      medidor: { estado: faixaBaixa(pctFixas, 0.5, 0.65), valor: pctFixas, nivel: clamp(pctFixas, 0, 1), peso: 1 },
      cozinha: { estado: faixaBaixa(pctVariaveis, 0.3, 0.4), valor: pctVariaveis, nivel: clamp(pctVariaveis / 0.5, 0, 1), peso: 0.8 },
      telhado: { estado: estadoDividas, valor: pctParcelas, nivel: clamp(pctParcelas / 0.4, 0, 1), peso: 1.2 },
      paineis: { estado: faixaAlta(coberturaPassiva, 0.25, 0.05), valor: coberturaPassiva, nivel: clamp(coberturaPassiva / 0.25, 0, 1), peso: 0.4 },
      jardim: { estado: faixaAlta(taxaPoupanca, 0.2, 0.05), valor: taxaPoupanca, nivel: clamp(taxaPoupanca / 0.2, 0, 1), peso: 1.2 },
    };

    let soma = 0, pesos = 0;
    for (const k in elementos) { soma += SCORE[elementos[k].estado] * elementos[k].peso; pesos += elementos[k].peso; }
    const saude = Math.round((soma / pesos) * 100);

    let clima;
    if (saude >= 80) clima = { id: 'ensolarado', nome: 'Ensolarado', intensidade: 0 };
    else if (saude >= 62) clima = { id: 'poucas-nuvens', nome: 'Poucas nuvens', intensidade: 0.22 };
    else if (saude >= 45) clima = { id: 'nublado', nome: 'Nublado', intensidade: 0.45 };
    else if (saude >= 28) clima = { id: 'chuva', nome: 'Chuva', intensidade: 0.72 };
    else clima = { id: 'tempestade', nome: 'Tempestade', intensidade: 1 };

    // Projeção simples: todo saldo positivo do mês vai para a reserva, sem rendimento

    if (!pins[id]) return null;
    tmpV.copy(pins[id].position).project(camera);
    const r = renderer.domElement.getBoundingClientRect();
    return { x: (tmpV.x * 0.5 + 0.5) * r.width, y: (-tmpV.y * 0.5 + 0.5) * r.height, visible: tmpV.z < 1 };
  }

  // ---------- pós-processamento (bloom, miniatura, cor e vinheta) ----------
  const GradeShader = {
    uniforms: { tDiffuse: { value: null }, sat: { value: 1.18 }, contrast: { value: 1.14 }, tint: { value: new THREE.Vector3(1.02, 1.0, 1.03) }, vig: { value: 0.22 } },
    vertexShader: 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.0); }',
    fragmentShader: [
      'uniform sampler2D tDiffuse; uniform float sat; uniform float contrast; uniform vec3 tint; uniform float vig; varying vec2 vUv;',
      'void main(){ vec4 c = texture2D(tDiffuse, vUv);',
      '  float l = dot(c.rgb, vec3(0.2126,0.7152,0.0722));',
      '  c.rgb = mix(vec3(l), c.rgb, sat);',
      '  c.rgb = max((c.rgb - 0.18) * contrast + 0.18, 0.0) * tint;',
      '  float d = distance(vUv, vec2(0.5));',
      '  c.rgb *= mix(1.0, smoothstep(0.95, 0.3, d), vig);',
      '  gl_FragColor = c; }'].join('\n'),
  };

  let quality = mobile ? 'media' : 'alta';
  try {
    const rt = new THREE.WebGLRenderTarget(256, 256, { type: THREE.HalfFloatType, samples: 4 }); // HDR + antisserrilhado
    composer = new EffectComposer(renderer, rt);
    composer.addPass(new RenderPass(scene, camera));
    bloom = new UnrealBloomPass(new THREE.Vector2(256, 256), 0.35, 0.4, 1.0); // só o que é luz forte (janelas, postes, sol) brilha
    composer.addPass(bloom);
    tiltH = new ShaderPass(HorizontalTiltShiftShader); tiltV = new ShaderPass(VerticalTiltShiftShader);
    composer.addPass(tiltH); composer.addPass(tiltV);
    composer.addPass(new ShaderPass(GradeShader));
    composer.addPass(new OutputPass());
  } catch (e) { console.warn('pós-processamento indisponível', e); composer = null; quality = 'baixa'; }

  function applyQuality() {
    const dpr = window.devicePixelRatio || 1;
    const pr = quality === 'alta' ? Math.min(dpr, 2) : quality === 'media' ? Math.min(dpr, 2) : Math.min(dpr, 1.5);
    renderer.setPixelRatio(pr);
    sun.shadow.mapSize.set(quality === 'alta' ? 2048 : 1024, quality === 'alta' ? 2048 : 1024);
    if (sun.shadow.map) { sun.shadow.map.dispose(); sun.shadow.map = null; }
    if (composer) composer.setPixelRatio(pr);
    resize();
  }

  // ---------- redimensionamento ----------
  let bottomInset = 0; // px cobertos pelo painel no celular: desloca o enquadramento para cima
  function resize() {
    const w = container.clientWidth || 1, h = container.clientHeight || 1;
    renderer.setSize(w, h, false); camera.aspect = w / h;
    camera.fov = w / h < 0.8 ? 46 : 38; // mais campo de visão em telas verticais
    if (bottomInset > 0) camera.setViewOffset(w, h, 0, bottomInset / 2, w, h); else camera.clearViewOffset();
    camera.updateProjectionMatrix();
    if (composer) {
      composer.setSize(w, h);
      const div = quality === 'alta' ? 1 : 2; // bloom em meia resolução no nível médio
      if (bloom) bloom.setSize(Math.round(w / div), Math.round(h / div));
      // faixa nítida do efeito miniatura acompanha o centro visível (acima da gaveta no celular)
      const focusY = 0.5 + bottomInset / (2 * h) - 0.02;
      const blur = w < 700 ? 0.55 : 1.1;
      if (tiltH) { tiltH.uniforms.h.value = blur / w; tiltH.uniforms.r.value = focusY; }
      if (tiltV) { tiltV.uniforms.v.value = blur / h; tiltV.uniforms.r.value = focusY; }
    }
  }
  function setBottomInset(px) { if (Math.abs(px - bottomInset) > 1) { bottomInset = px; resize(); } }
  new ResizeObserver(resize).observe(container); applyQuality();
  flyTo(homePos(), HOME.target); // entrada: a câmera desce até a casa

  // ---------- loop ----------
  const clock = new THREE.Clock();
  let flash = 0, nextFlash = 3, elapsed = 0, fpsAcc = 0, fpsN = 0, autoQuality = true;
  const ease = (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);
  function frame() {
    const dt = Math.min(clock.getDelta(), 0.05); elapsed += dt;
    const k = 1 - Math.exp(-dt * 3);

    if (tween) {
      tween.t = Math.min(1, tween.t + dt / 1.1); const e = ease(tween.t);
      camera.position.lerpVectors(tween.p0, tween.p1, e); controls.target.lerpVectors(tween.t0, tween.t1, e);
      if (tween.t >= 1) tween = null;
    }
    controls.update();

    // transições
    for (const key of ['water', 'tilt', 'needle', 'smoke', 'lush', 'treeS', 'w', 'rain', 'drip']) cur[key] += (target[key] - cur[key]) * k;
    water.scale.y = cur.water;
    house.rotation.z = cur.tilt;
    needlePivot.rotation.z = cur.needle + Math.sin(elapsed * 7) * 0.015;
    cracks.forEach((c, i) => { c.visible = i < target.cracks; });
    roofDamage.forEach((p, i) => { p.visible = i < target.roofDmg; });
    tarp.visible = target.tarp;
    roofMat.color.copy(roofBase).lerp(roofBad, target.roofDmg / roofDamage.length * 0.6);
    panels.forEach((p, i) => { p.userData.cell.material = i < target.panels ? panelOn : panelOff; });
    panelOn.emissiveIntensity = 0.25 + 0.15 * Math.sin(elapsed * 2);
    flowers.forEach((f, i) => {
      const want = i < target.flowers ? 1 : 0; f.userData.s += (want - f.userData.s) * k;
      f.visible = f.userData.s > 0.02; f.scale.setScalar(Math.max(0.001, f.userData.s));
    });
    lawnMat.color.copy(dryCol).lerp(lushCol, cur.lush);
    bushMat.color.copy(bushDry).lerp(bushLush, cur.lush);
    gardenTree.scale.setScalar(cur.treeS);

    // fumaça da chaminé
    const smokeN = Math.round(2 + cur.smoke * 8);
    smoke.forEach((s, i) => {
      s.userData.t += dt * (0.25 + cur.smoke * 0.25); if (s.userData.t > 1) s.userData.t -= 1;
      const t = s.userData.t; s.visible = i < smokeN;
      s.position.set(chimneyTop.x + Math.sin(t * 5 + i) * 0.3 + t * 0.8, chimneyTop.y + t * 3.2, chimneyTop.z + t * 0.4);
      s.scale.setScalar(0.4 + t * (0.8 + cur.smoke));
      s.material.opacity = (1 - t) * 0.75;
      s.material.color.set(cur.smoke > 0.8 ? '#cfc8d8' : '#f1eef8');
    });

    // goteiras
    drips.forEach((d, i) => {
      d.visible = cur.drip > 0.05 && i / drips.length < target.drip;
      if (!d.visible) return;
      d.userData.t += dt * 0.9; if (d.userData.t > 1) d.userData.t = 0;
      const t = d.userData.t; const top = Y0 + B.h + 0.05;
      d.position.set(d.userData.x, top - t * t * (top - Y), d.userData.z);
    });

    // clima
    computeEnvTarget();
    for (const c of ['top', 'bottom', 'sun', 'hemiSky', 'hemiGround']) env[c].lerp(envT[c], k);
    env.sunI += (envT.sunI - env.sunI) * k; env.hemiI += (envT.hemiI - env.hemiI) * k; env.night += (envT.night - env.night) * k;
    env.sunPos.lerp(envT.sunPos, k);

    if (cur.rain > 0.8 && target.rain === 1) {
      nextFlash -= dt;
      if (nextFlash <= 0) { flash = 1; nextFlash = rnd(2.5, 6.5); }
    }
    flash = Math.max(0, flash - dt * 6);
    const fl = flash > 0 ? (Math.sin(flash * 40) > 0 ? flash : flash * 0.3) : 0;

    skyMat.uniforms.top.value.copy(env.top); skyMat.uniforms.bottom.value.copy(env.bottom);
    if (fl) { skyMat.uniforms.top.value.lerp(new THREE.Color('#e8ecff'), fl * 0.6); skyMat.uniforms.bottom.value.lerp(new THREE.Color('#ffffff'), fl * 0.6); }
    scene.fog.color.copy(env.bottom);
    scene.fog.near = 45 - 20 * cur.w; scene.fog.far = 170 - 70 * cur.w;
    sun.color.copy(env.sun); sun.intensity = env.sunI; sun.position.copy(env.sunPos).normalize().multiplyScalar(40);
    skyMat.uniforms.sunDir.value.copy(env.sunPos).normalize();
    skyMat.uniforms.sunCol.value.copy(env.sun);
    skyMat.uniforms.sunAmt.value = (1 - cur.w * 0.95) * (0.55 + 0.45 * (1 - env.night));

    // reflexos: regenera o ambiente quando hora/clima mudam (depois que a transição assenta)
    const key = tempo + '|' + target.w.toFixed(2);
    if (key !== envKey) { envKey = key; envTimer = 1.4; }
    if (envTimer > 0) { envTimer -= dt; if (envTimer <= 0 || !envRT) { envTimer = 0; rebuildEnv(); } }

    // chão molhado e poças
    puddleMat.opacity = cur.rain * 0.75;
    puddles.forEach((p) => { p.visible = cur.rain > 0.03; });
    roadMats.forEach((m) => { m.roughness = 0.85 - 0.5 * cur.rain; });

    // partículas de conquista
    if (sparkLife > 0) {
      sparkLife -= dt; const a = sparkGeo.attributes.position.array;
      for (let i = 0; i < sparkCount; i++) {
        sparkVel[i * 3 + 1] -= 6 * dt;
        a[i * 3] += sparkVel[i * 3] * dt; a[i * 3 + 1] += sparkVel[i * 3 + 1] * dt; a[i * 3 + 2] += sparkVel[i * 3 + 2] * dt;
      }
      sparkGeo.attributes.position.needsUpdate = true;

    } else sparkMat.opacity = 0;
    hemi.color.copy(env.hemiSky); hemi.groundColor.copy(env.hemiGround); hemi.intensity = env.hemiI + fl * 4;
    renderer.toneMappingExposure = 1 + env.night * 0.3;

    const night = env.night;
    glassMat.emissiveIntensity = night * 1.4;
    kitchenGlass.emissiveIntensity = 0.25 + night * 1.6;
    bulbMat.emissiveIntensity = night > 0.3 ? night * 3 : 0;
    lampLights.forEach((l) => { l.intensity = night * 30; });
    const nightOnly = Math.max(0, (night - 0.6) / 0.4); // só acende de noite, não no entardecer
    porch.intensity = nightOnly * 2.5; porchBulb.emissiveIntensity = nightOnly * 0.9;
    cityMats.forEach((m) => { m.emissiveIntensity = night * 1.3; });
    starMat.opacity = Math.max(0, night - 0.4) * 1.6 * (1 - cur.w);

    // nuvens
    const nClouds = Math.round(3 + cur.w * 12);
    const cloudC = new THREE.Color('#ffffff').lerp(new THREE.Color('#6b7080'), cur.w * 0.85);
    if (night > 0.6) cloudC.lerp(new THREE.Color('#4a4f80'), 0.75);
    cloudMat.color.copy(cloudC);
    clouds.forEach((c, i) => {
      c.visible = i < nClouds;
      const u = c.userData; u.ang += u.sp * dt * (1 + cur.w * 2);
      c.position.set(Math.cos(u.ang) * u.r, u.y - cur.w * 3, Math.sin(u.ang) * u.r);
      c.rotation.y = -u.ang;
    });

    // chuva
    rain.visible = cur.rain > 0.03;
    if (rain.visible) {
      rainMat.opacity = cur.rain * 0.55;
      const speed = 22 * dt, a = rainGeo.attributes.position.array;
      for (let i = 0; i < DROPS; i++) {
        const o = i * 6; a[o + 1] -= speed; a[o + 4] -= speed;
        if (a[o + 4] < 0) { a[o + 1] += 26; a[o + 4] += 26; }
      }
      rainGeo.attributes.position.needsUpdate = true;
    }

    // pinos
    for (const id in pins) {
      const g = pins[id], u = g.userData;

      u.halo.scale.setScalar(1 + pulse * 0.35); u.haloMat.opacity = u.alerta ? 0.45 * (1 - pulse * 0.7) : 0;

      const s = dist * (isSel ? 0.7 : isHover ? 1.25 : 1);
      g.scale.setScalar(g.scale.x + (s - g.scale.x) * Math.min(1, k * 3));
      const op = isSel ? 0.55 : selected ? 0.35 : 1;
      u.mat.opacity = op; u.dot.material.opacity = op;
    }

    if (composer && quality !== 'baixa') {
      try { composer.render(dt); } catch (e) { console.warn(e); composer = null; quality = 'baixa'; applyQuality(); }
    } else renderer.render(scene, camera);

    // desempenho: se o aparelho não acompanhar, reduz a qualidade sozinho
    if (elapsed > 4 && autoQuality) {
      fpsAcc += dt; fpsN++;
      if (fpsAcc >= 3) {
        const fps = fpsN / fpsAcc; fpsAcc = 0; fpsN = 0;
        const next = fps < 24 && quality === 'media' ? 'baixa' : fps < 32 && quality === 'alta' ? 'media' : null;

    }

    requestAnimationFrame(frame);
  }

  return {
    applyState, setBottomInset, setTime, focus, resetView, setAutoRotate, screenPos, celebrate,
    setQuality: (q) => { autoQuality = false; setQuality(q); }, get quality() { return quality; }, get hasEffects() { return !!composer; },
    get autoRotate() { return controls.autoRotate; },
  };
}

function load() { try { const s = JSON.parse(localStorage.getItem(LS_KEY) || 'null'); return s && s.dados ? s : null; } catch (e) { return null; } }
function save() {
  try { localStorage.setItem(LS_KEY, JSON.stringify({ dados: state.dados, exemplo: state.exemplo, visitados: [...state.visitados], simulou: state.simulou, tempo: state.tempo, concluidas: [...state.concluidas] })); } catch (e) { /* armazenamento indisponível */ }
}
const saved = load();
const state = {
  dados: saved ? C.sanitize(saved.dados) : { ...C.EXEMPLO },
  exemplo: saved ? !!saved.exemplo : true,
  sim: null, simulou: saved ? !!saved.simulou : false,
  selecionado: null, aba: 'visao', tempo: (saved && saved.tempo) || 'entardecer',
  visitados: new Set(saved ? saved.visitados : []), concluidas: new Set(saved ? saved.concluidas : []),
  painelAberto: true, autoGiro: true,
};
let calc = C.compute(state.sim || state.dados);

// ---------- DOM ----------
const $ = (s, el = document) => el.querySelector(s);
const panelBody = $('#panel-body');
const tooltip = $('#tooltip');
let world = null;

function finnSvg(size = 40) {
  return `<svg width="${size}" height="${size}" viewBox="0 0 48 48" aria-hidden="true"><defs><linearGradient id="fg${size}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5eead4"/><stop offset="1" stop-color="#8b5cf6"/></linearGradient></defs><path d="M24 6c2-4 7-5 9-3-2 1-4 3-5 6" fill="#34d399"/><circle cx="24" cy="27" r="17" fill="url(#fg${size})"/><circle cx="24" cy="27" r="12.5" fill="none" stroke="#fff" stroke-opacity=".35" stroke-width="1.5"/><circle cx="18.5" cy="25" r="2.6" fill="#1b1533"/><circle cx="29.5" cy="25" r="2.6" fill="#1b1533"/><circle cx="19.3" cy="24.1" r=".9" fill="#fff"/><circle cx="30.3" cy="24.1" r=".9" fill="#fff"/><path d="M19.5 31.5q4.5 3.6 9 0" stroke="#1b1533" stroke-width="2" fill="none" stroke-linecap="round"/><circle cx="14" cy="30" r="2" fill="#ff8fb1" opacity=".7"/><circle cx="34" cy="30" r="2" fill="#ff8fb1" opacity=".7"/></svg>`;
}
$('#brand-finn').innerHTML = finnSvg(30);

function climaIcone(id) {
  return { ensolarado: '☀️', 'poucas-nuvens': '🌤️', nublado: '☁️', chuva: '🌧️', tempestade: '⛈️' }[id];
}

function piorElemento(r) {
  const ord = { critico: 0, atencao: 1, bom: 2 };
  return ORDEM.filter((id) => id !== 'paineis').sort((a, b) => ord[r.elementos[a].estado] - ord[r.elementos[b].estado] || r.elementos[b].peso - r.elementos[a].peso)[0];
}

function tag(tipo) {
  const map = { cad: ['Dados cadastrados', 't-cad'], sim: ['Simulação', 't-sim'], calc: ['Calculado', 't-calc'], proj: ['Projeção', 't-proj'] };
  const [txt, cls] = map[tipo]; return `<span class="tag ${cls}">${txt}</span>`;
}

// ---------- renderização ----------
const RANK = { critico: 0, atencao: 1, bom: 2 };
const FRASE_MELHORA = {
  fundacao: 'A fundação ficou mais firme!', caixa: 'A caixa d’água encheu!', medidor: 'O ponteiro aliviou!',
  cozinha: 'A chaminé acalmou!', telhado: 'O telhado foi consertado!', paineis: 'Mais painéis acenderam!', jardim: 'O jardim floresceu!',
};
let ultimoEstado = null;
function celebrarMelhoras(r) {
  if (ultimoEstado) {
    const melhorou = ORDEM.filter((id) => RANK[r.elementos[id].estado] > RANK[ultimoEstado[id]]);
    if (melhorou.length) {
      melhorou.forEach((id, i) => setTimeout(() => world && world.celebrate(id), i * 350));
      toast(`✨ ${FRASE_MELHORA[melhorou[0]]}${melhorou.length > 1 ? ` (+${melhorou.length - 1})` : ''}`);
    }
  }
  ultimoEstado = Object.fromEntries(ORDEM.map((id) => [id, r.elementos[id].estado]));
}

function render() {
  calc = C.compute(state.sim || state.dados);
  if (world) world.applyState(calc);
  celebrarMelhoras(calc);
  // topo
  $('#weather').innerHTML = `<span class="wi">${climaIcone(calc.clima.id)}</span><span><b>${calc.clima.nome}</b><small>Saúde ${calc.saude}/100</small></span>`;
  $('#mode-chip').textContent = state.sim ? 'Simulação' : state.exemplo ? 'Casa de exemplo' : 'Minha casa';
  $('#mode-chip').className = 'chip ' + (state.sim ? 'chip-sim' : '');
  $('#sim-banner').hidden = !state.sim;
  document.querySelectorAll('[data-tempo]').forEach((b) => b.classList.toggle('on', b.dataset.tempo === state.tempo));
  $('#btn-giro').classList.toggle('on', state.autoGiro);
  if (world) $('#btn-qual').dataset.q = world.quality;
  document.querySelectorAll('.tabs [data-aba]').forEach((b) => b.classList.toggle('on', b.dataset.aba === state.aba));
  $('#panel').classList.toggle('closed', !state.painelAberto);
  if (world) {
    const mobile = window.matchMedia('(max-width: 860px)').matches;
    world.setBottomInset(mobile ? (state.painelAberto ? window.innerHeight * 0.44 : 104) : 0);
  }

  if (state.aba === 'visao') panelBody.innerHTML = state.selecionado ? viewDetalhe(state.selecionado) : viewVisao();
  else if (state.aba === 'dados') panelBody.innerHTML = viewDados();
  else if (state.aba === 'simular') panelBody.innerHTML = viewSimular();
  else panelBody.innerHTML = viewMissoes();
  checarMissoes();
}

function viewVisao() {
  const r = calc, base = state.sim ? tag('sim') : tag('calc');
  const pior = piorElemento(r);
  const tiles = ORDEM.map((id) => {
    const e = r.elementos[id];
    return `<button class="tile st-${id === 'paineis' && e.estado === 'critico' ? 'build' : e.estado}" data-sel="${id}">
      <span class="tile-top"><span class="ico">${ELEM[id].icone}</span><span class="dot"></span></span>
      <b>${ELEM[id].nome}</b><small>${ELEM[id].representa}</small>
      <span class="tile-val">${ELEM[id].valor(r)}</span></button>`;
  }).join('');
  return `
  <section class="card health">
    <div class="row between"><span class="eyebrow">Saúde financeira</span>${base}</div>
    <div class="score"><b>${r.saude}</b><span>/100</span><em>${climaIcone(r.clima.id)} ${r.clima.nome}</em></div>
    <div class="bar"><i style="width:${r.saude}%"></i></div>
    <div class="stats">
      <div><small>Renda do mês</small><b>${brl.format(r.rendaTotal)}</b></div>
      <div><small>Custo do mês</small><b>${brl.format(r.custoMensal)}</b></div>
      <div><small>Sobra do mês</small><b class="${r.saldoMensal < 0 ? 'neg' : 'pos'}">${brl.format(r.saldoMensal)}</b></div>
    </div>
  </section>
  <div class="row between section-h"><h3>Espelho da casa</h3><small>Toque para inspecionar</small></div>
  <div class="tiles">${tiles}</div>
  <section class="card finn">${finnSvg(40)}<div><b>Finn</b><p>${r.elementos[pior].estado === 'bom' ? 'Sua casa está em ótimo estado! Explore cada parte para entender o que a mantém de pé.' : `O ponto que mais pede atenção agora: <a href="#" data-sel="${pior}">${ELEM[pior].nome}</a>. ${ELEM[pior].dicas[r.elementos[pior].estado]}`}</p></div></section>
  <section class="card">
    <div class="row between"><span class="eyebrow">Daqui a 12 meses</span>${tag('proj')}</div>
    <p class="proj">${r.saldoMensal > 0
      ? `Se a sobra de <b>${brl.format(r.saldoMensal)}</b> por mês for toda para a reserva, ela chega a <b>${brl.format(r.projecao.reserva12)}</b> (${meses(r.projecao.mesesReserva12)} de custo coberto).`
      : 'Hoje não sobra dinheiro no fim do mês, então a reserva não cresce sozinha. Use a aba Simular para testar ajustes.'}</p>
    <small class="muted">Projeção simples: não considera rendimentos, juros nem inflação.</small>
  </section>
  ${state.exemplo ? `<button class="btn primary wide" data-aba-go="dados">Usar meus próprios dados</button>` : ''}`;
}

function viewDetalhe(id) {
  const r = calc, e = r.elementos[id], m = ELEM[id];
  const st = id === 'paineis' && e.estado === 'critico' ? 'build' : e.estado;
  const extra = id === 'telhado' && r.projecao.mesesParaQuitar
    ? `<p class="muted">Mantendo as parcelas atuais, a quitação levaria cerca de ${r.projecao.mesesParaQuitar} meses (estimativa sem juros). ${tag('proj')}</p>` : '';
  return `
  <button class="back" data-back>← Voltar à casa</button>
  <div class="det-h"><span class="ico big">${m.icone}</span><div><h2>${m.nome}</h2><small>Representa: <b>${m.representa}</b></small></div></div>
  <section class="card st-${st} det-val"><span class="badge">${nomeEstado(id, e.estado)}</span>
    <b>${m.valor(r)}</b><small>${m.rotulo}</small>${state.sim ? tag('sim') : tag('calc')}</section>
  <section class="card"><span class="eyebrow">Na sua casa</span><p>${m.naCasa}</p></section>
  <section class="card"><span class="eyebrow">Como calculamos</span><p class="mono">${m.formula}</p><small class="muted">${m.faixas}</small>${extra}</section>
  <section class="card finn">${finnSvg(40)}<div><b>Finn</b><p>${m.dicas[e.estado]}</p></div></section>
  <div class="row gap"><button class="btn" data-aba-go="dados">Ajustar meus dados</button><button class="btn primary" data-aba-go="simular">Simular decisão</button></div>`;
}

function viewDados() {
  const grupo = (tipo, titulo) => C.FIELDS.filter((f) => f.tipo === tipo).map((f) => `
    <label class="field"><span>${f.label}<small>${f.hint}</small></span>
      <div class="money"><i>R$</i><input type="text" inputmode="decimal" autocomplete="off" name="${f.key}" value="${fmtNum(state.dados[f.key])}"></div></label>`).join('');
  return `
  <div class="row between"><h3>Meus dados</h3>${tag('cad')}</div>
  <p class="muted">Valores aproximados já bastam. Seus dados ficam salvos só neste navegador.</p>
  <form id="form-dados" novalidate>
    <div class="eyebrow mt">Por mês</div>${grupo('fluxo')}
    <div class="eyebrow mt">Saldos de hoje</div>${grupo('estoque')}
    <div class="row gap mt"><button type="button" class="btn" data-exemplo>Restaurar exemplo</button><button class="btn primary" type="submit">Salvar e ver a casa</button></div>
  </form>`;
}

const CENARIOS = [
  { id: 'corte', nome: 'Cortar 20% das variáveis', f: (d) => ({ ...d, despesasVariaveis: Math.round(d.despesasVariaveis * 0.8) }) },
  { id: 'aporte', nome: 'Receber R$ 3.000 e guardar na reserva', f: (d) => ({ ...d, reserva: d.reserva + 3000 }) },
  { id: 'quitar', nome: 'Quitar uma dívida (−R$ 400/mês)', f: (d) => ({ ...d, parcelasDividas: Math.max(0, d.parcelasDividas - 400), saldoDividas: Math.max(0, d.saldoDividas - 400 * 12) }) },
  { id: 'parcela', nome: 'Nova parcela de R$ 800', f: (d) => ({ ...d, parcelasDividas: d.parcelasDividas + 800, saldoDividas: d.saldoDividas + 800 * 24 }) },
  { id: 'perda', nome: 'Perder 30% da renda', f: (d) => ({ ...d, rendaAtiva: Math.round(d.rendaAtiva * 0.7) }) },
];

function compareHtml(base, now) {
  const delta = now.saude - base.saude;
  return `<section class="card compare">
    <div><small>Hoje</small><b>${base.saude}</b><em>${climaIcone(base.clima.id)} ${base.clima.nome}</em></div>
    <div class="arrow ${delta > 0 ? 'pos' : delta < 0 ? 'neg' : ''}">${delta > 0 ? '+' : ''}${delta}</div>
    <div><small>Simulado</small><b>${now.saude}</b><em>${climaIcone(now.clima.id)} ${now.clima.nome}</em></div></section>`;
}

function viewSimular() {
  const s = state.sim || state.dados;
  const base = C.compute(state.dados), now = calc;
  const sliders = C.FIELDS.map((f) => {
    const v0 = state.dados[f.key], max = Math.max(1000, Math.ceil((Math.max(v0, s[f.key]) * 2) / 500) * 500);
    const changed = s[f.key] !== v0;
    return `<label class="slider ${changed ? 'changed' : ''}"><span>${f.label}<b>${brl.format(s[f.key])}</b></span>
      <input type="range" min="0" max="${max}" step="50" name="${f.key}" value="${s[f.key]}">
      <small>Cadastrado: ${brl.format(v0)}</small></label>`;
  }).join('');
  return `
  <div class="sticky">${compareHtml(base, now)}</div>
  <div class="row between"><h3>Simular decisão</h3>${tag('sim')}</div>
  <p class="muted">Teste uma decisão e veja a casa reagir. Nada é salvo até você aplicar.</p>
  <div class="chips">${CENARIOS.map((c) => `<button class="chip-btn" data-cen="${c.id}">${c.nome}</button>`).join('')}</div>
  <div class="sliders">${sliders}</div>
  <div class="row gap mt"><button class="btn" data-sim-descartar ${state.sim ? '' : 'disabled'}>Descartar</button><button class="btn primary" data-sim-aplicar ${state.sim ? '' : 'disabled'}>Aplicar aos meus dados</button></div>`;
}

function viewMissoes() {
  const itens = MISSOES.map((m) => {
    const [a, b] = m.prog(); const ok = a >= b;
    return `<div class="mission ${ok ? 'done' : ''}"><span class="check">${ok ? '✓' : ''}</span>
      <div><b>${m.nome}</b><small>${m.desc}</small><div class="bar sm"><i style="width:${Math.min(100, (a / b) * 100)}%"></i></div></div>
      <span class="mprog">${b > 1 ? `${num1(Math.min(a, b))}/${b}` : ok ? 'Feita' : ''}</span></div>`;
  }).join('');
  const feitas = MISSOES.filter((m) => { const [a, b] = m.prog(); return a >= b; }).length;
  return `<div class="row between"><h3>Missões</h3><span class="chip">${feitas}/${MISSOES.length}</span></div>
  <section class="card finn">${finnSvg(40)}<div><b>Finn</b><p>Cada missão ensina uma parte da sua vida financeira. Comece explorando a casa!</p></div></section>
  ${itens}`;
}

function checarMissoes() {
  for (const m of MISSOES) {
    const [a, b] = m.prog();
    if (a >= b && !state.concluidas.has(m.id)) {
      state.concluidas.add(m.id); save();
      toast(`🏅 Missão concluída: ${m.nome}`);
    }
  }
}

let toastTimer = null;
function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 2800);
}

// ---------- ações ----------
function selecionar(id) {
  if (!id || !ELEM[id]) return;
  state.selecionado = id; state.aba = 'visao'; state.painelAberto = true;
  state.visitados.add(id); save();
  state.autoGiro = false;
  if (world) world.focus(id);
  render(); panelBody.scrollTop = 0;
}
function voltar() {
  state.selecionado = null; if (world) world.resetView(); render();
}
function irAba(aba) {
  state.aba = aba; state.painelAberto = true;
  // em Meus dados e Simular a câmera volta para a casa inteira, para ver a reação
  if (aba !== 'visao') { state.selecionado = null; if (world) world.resetView(); }
  render(); panelBody.scrollTop = 0;
}

document.addEventListener('click', (ev) => {
  const el = ev.target.closest('[data-sel],[data-back],[data-aba],[data-aba-go],[data-tempo],[data-cen],[data-exemplo],[data-sim-aplicar],[data-sim-descartar],#btn-giro,#btn-home,#btn-qual,#panel-handle');
  if (!el) return;
  if (el.tagName === 'A') ev.preventDefault();
  if (el.dataset.sel) return selecionar(el.dataset.sel);
  if (el.hasAttribute('data-back')) return voltar();
  if (el.dataset.aba) return irAba(el.dataset.aba);
  if (el.dataset.abaGo) return irAba(el.dataset.abaGo);
  if (el.dataset.tempo) { state.tempo = el.dataset.tempo; if (world) world.setTime(state.tempo); save(); return render(); }
  if (el.dataset.cen) {
    const c = CENARIOS.find((x) => x.id === el.dataset.cen);
    state.sim = C.sanitize(c.f(state.sim || state.dados)); state.simulou = true; save();
    toast(`Simulando: ${c.nome}`); return render();
  }
  if (el.hasAttribute('data-exemplo')) { state.dados = { ...C.EXEMPLO }; state.exemplo = true; state.sim = null; save(); toast('Dados de exemplo restaurados'); return render(); }
  if (el.hasAttribute('data-sim-aplicar')) { if (state.sim) { state.dados = state.sim; state.sim = null; state.exemplo = false; save(); toast('Simulação aplicada aos seus dados'); } return render(); }
  if (el.hasAttribute('data-sim-descartar')) { state.sim = null; toast('Simulação descartada'); return render(); }
  if (el.id === 'btn-giro') { state.autoGiro = !state.autoGiro; if (world) world.setAutoRotate(state.autoGiro); return render(); }
  if (el.id === 'btn-home') { state.selecionado = null; if (world) world.resetView(); return render(); }
  if (el.id === 'btn-qual') {
    if (!world) return;
    const ordem = world.hasEffects ? ['alta', 'media', 'baixa'] : ['baixa'];
    const next = ordem[(ordem.indexOf(world.quality) + 1) % ordem.length];
    world.setQuality(next); toast(`Qualidade visual: ${{ alta: 'alta', media: 'média', baixa: 'econômica' }[next]}`); return render();
  }
  if (el.id === 'panel-handle') { state.painelAberto = !state.painelAberto; return render(); }
});

document.addEventListener('submit', (ev) => {
  if (ev.target.id !== 'form-dados') return;
  ev.preventDefault();
  const fd = new FormData(ev.target); const d = {};
  for (const f of C.FIELDS) d[f.key] = parseBR(fd.get(f.key));
  state.dados = C.sanitize(d); state.exemplo = false; state.sim = null; save();
  toast('Dados salvos. Veja como ficou sua casa!');
  state.aba = 'visao'; state.selecionado = null; if (world) world.resetView(); render();
});

document.addEventListener('focusout', (ev) => {
  const t = ev.target; if (!t.closest || !t.closest('#form-dados') || t.tagName !== 'INPUT') return;
  t.value = fmtNum(parseBR(t.value));
});

let simRaf = null;
document.addEventListener('input', (ev) => {
  const t = ev.target;
  if (t.type !== 'range' || !t.closest('.sliders')) return;
  state.sim = { ...(state.sim || state.dados), [t.name]: Number(t.value) };
  state.simulou = true;
  // atualiza a casa e os números sem recriar os sliders (mantém o arraste fluido)
  const lab = t.closest('.slider'); lab.querySelector('b').textContent = brl.format(Number(t.value));
  lab.classList.toggle('changed', Number(t.value) !== state.dados[t.name]);
  cancelAnimationFrame(simRaf);
  simRaf = requestAnimationFrame(() => {
    calc = C.compute(state.sim); if (world) world.applyState(calc);
    const base = C.compute(state.dados);
    const cmp = panelBody.querySelector('.compare');
    if (cmp) cmp.outerHTML = compareHtml(base, calc);
    celebrarMelhoras(calc);
    $('#weather').innerHTML = `<span class="wi">${climaIcone(calc.clima.id)}</span><span><b>${calc.clima.nome}</b><small>Saúde ${calc.saude}/100</small></span>`;
    $('#mode-chip').textContent = 'Simulação'; $('#mode-chip').className = 'chip chip-sim';
    $('#sim-banner').hidden = false;
    panelBody.querySelectorAll('[data-sim-aplicar],[data-sim-descartar]').forEach((b) => { b.disabled = false; });
  });
});
document.addEventListener('change', (ev) => { if (ev.target.type === 'range' && ev.target.closest('.sliders')) { save(); checarMissoes(); } });

// ---------- tooltip de hover ----------
let hoverId = null;
function onFrame() {
  if (!hoverId || !world) return;
  const p = world.screenPos(hoverId);
  if (!p || !p.visible) { tooltip.hidden = true; return; }
  tooltip.style.transform = `translate(${p.x}px, ${p.y - 26}px) translate(-50%, -100%)`;
}

// ---------- inicialização ----------
function webglOk() {
  try { const c = document.createElement('canvas'); return !!(window.WebGL2RenderingContext && c.getContext('webgl2')) || !!c.getContext('webgl'); } catch (e) { return false; }
}
if (webglOk()) {
  try {
    world = createWorld($('#canvas-wrap'), {
      onPick: (id) => { if (id) selecionar(id); },
      onHover: (id) => {
        hoverId = id; tooltip.hidden = !id;
        if (id) { const e = calc.elementos[id]; tooltip.innerHTML = `<b>${ELEM[id].nome}</b><span>${ELEM[id].representa} · ${nomeEstado(id, e.estado)}</span>`; }
      },
      onUserMove: () => { if (state.autoGiro) { state.autoGiro = false; $('#btn-giro').classList.remove('on'); } },
      onFrame,
      onQuality: (q) => { $('#btn-qual').dataset.q = q; toast(q === 'baixa' ? 'Qualidade reduzida para manter a fluidez' : 'Qualidade ajustada ao seu aparelho'); },
    });
    world.setTime(state.tempo);
  } catch (err) {
    console.error(err); world = null; $('#webgl-error').hidden = false;
  }
} else {
  $('#webgl-error').hidden = false;
}
$('#loading').remove();
window.addEventListener('resize', () => { if (world) { const mobile = window.matchMedia('(max-width: 860px)').matches; world.setBottomInset(mobile ? (state.painelAberto ? window.innerHeight * 0.44 : 104) : 0); } });
render();
if (world) world.setAutoRotate(state.autoGiro);

</script>
</body>
</html>
